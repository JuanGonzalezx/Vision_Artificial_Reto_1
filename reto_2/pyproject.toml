[project]
name = "reto-2"
version = "0.1.0"
description = "Reto 2 - robot seguidor de linea con reconocimiento de senales por CNN (Vision Artificial, UCaldas)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=5.0.0.93",
    "numpy>=2.0",
    "scikit-learn>=1.5",   # K-Means de la clase 4
    "matplotlib>=3.9",     # curvas y matrices de confusion del entrenamiento
    "pyserial>=3.5",       # hablarle al mBot por /dev/tty.* en macOS
    "tensorflow>=2.22.0rc0",
]

[tool.uv]
package = false
